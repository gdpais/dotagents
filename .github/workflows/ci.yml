name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - name: Validate skills (frontmatter, links, script references)
        run: bun run lint
      - name: Script tests
        run: bun run test
      - name: Secret scan
        run: bun claude/plugins/delivery/skills/delivery-lifecycle/scripts/scan_secrets.ts claude
      - name: Audit this workflow
        run: bun claude/plugins/delivery/skills/ci-cd-pipeline/scripts/audit_ci.ts
